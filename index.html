<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker | Home</title>

    <!-- fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Tailwind + DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome CDN  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body>
    <!-- dashboard section  -->
    <section class="min-h-screen  px-24 bg-base-200 p-10 mb-[-80px] sm:mb-[-240px] lg:mb-[-390px]">
        <h1 class="text-[#003366] text-[22px] sm:text-[28px] lg:text-[34px] font-bold mb-6 leading-8">Job Application
            Tracker</h1>

        <div class=" grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-[30px]">
            <div class="bg-base-100 p-6 border border-gray-100 rounded-lg">
                <div class="text-sm font-semibold text-gray-600">Total</div>
                <div class="text-[#003366] text-[20px] sm:text-[23px] lg:text-[26px] mt-2 font-bold">8</div>
            </div>

            <div class="bg-base-100 p-6 border border-gray-100 rounded-lg">
                <div class="text-sm font-semibold text-gray-600">Interview</div>
                <div class="text-emerald-500 text-[20px] sm:text-[23px] lg:text-[26px] mt-2 font-bold">0</div>
            </div>

            <div class="bg-base-100 p-6 border border-gray-100 rounded-lg">
                <div class="text-sm font-semibold text-gray-600">Rejected</div>
                <div class="text-red-500 text-[20px] sm:text-[23px] lg:text-[26px] mt-2 font-bold">0</div>
            </div>
        </div>
        <hr class="border border-gray-200">
    </section>

    <!-- available jobs section  -->
    <section class="min-h-screen  px-24 bg-base-200">
        <div class="flex justify-between">
            <div>
                <h1 class="text-[#003366] text-[18px] lg:text-[22px] font-bold mb-6 leading-8">Available Jobs</h1>
            </div>
            <div>
                <p class=" text-xs lg:text-sm font-semibold text-gray-500">8 jobs</p>
            </div>
        </div>
        <button
            class="btn bg-[#3B82F6] text-[#FFFFFF] text-[11px] sm:text-[14px] px-5 sm:px-7 py-2 btn-xs sm:btn-sm hover:bg-[#195ece]">All</button>
        <button
            class="btn btn-soft text-[#64748B] text-[11px] sm:text-[14px] bg-base-100 btn-xs sm:btn-sm hover:bg-[#e6e7ea]">Interview</button>
        <button
            class="btn btn-soft text-[#64748B] text-[11px] sm:text-[14px] bg-base-100 btn-xs sm:btn-sm hover:bg-[#e6e7ea]">Rejected</button>
        <div>
        </div>
    </section>

</body>

</html>
